[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberpme-agent"
version = "0.1.0"
description = "Agent léger de supervision CyberPME Africa"
requires-python = ">=3.10"
dependencies = ["psutil>=6.1,<8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[project.scripts]
cyberpme-agent = "cyberpme_agent.main:main"

[tool.setuptools.packages.find]
include = ["cyberpme_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
