name: CyberPME CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-installer:
    name: Validation installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install-cyberpme-agent.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors | Format-List; exit 1 }
  agent:
    name: Agent Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer l’agent
        run: pip install -e './agent[dev]'
      - name: Tester l’agent
        working-directory: agent
        run: pytest -q

  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: security_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: security_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U security_ci -d security_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer les dépendances
        run: pip install -e './backend[dev]'
      - name: Exécuter les tests
        working-directory: backend
        env:
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
        run: pytest -q
      - name: Tester les contrôles de sécurité sur PostgreSQL isolé
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://security_ci:disposable-ci-only@localhost:5432/security_ci
          SMTP_HOST: localhost
        run: python backend/scripts/test_postgres_security.py
      - name: Auditer les dépendances Python
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit --local --skip-editable --format json --output python-audit.json
      - name: Conserver les preuves Python
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-audit
          path: python-audit.json

  integrations:
    name: Tests intégrations IDS
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer pytest
        run: pip install pytest
      - name: Tester les adaptateurs
        run: pytest -q integrations/tests
      - name: Vérifier le configurateur Wazuh
        run: bash -n integrations/wazuh/configure-cyberpme
      - name: Vérifier les scripts Suricata
        run: |
          bash -n integrations/suricata/install.sh
          bash -n integrations/suricata/uninstall.sh

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci
      - name: Compiler le dashboard
        working-directory: frontend
        run: npm run build
      - name: Tester les indicateurs du dashboard
        working-directory: frontend
        run: npm test
      - name: Auditer les dépendances frontend
        working-directory: frontend
        run: npm audit --audit-level=moderate

  docker-compose:
    name: Validation Docker Compose
    runs-on: ubuntu-latest
    env:
      AGENT_ENROLLMENT_KEY: ci-enrollment-secret
      NETWORK_SCAN_KEY: ci-network-scan-secret
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Valider la configuration
        run: docker compose config --quiet
