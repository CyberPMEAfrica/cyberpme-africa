name: CyberPME CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent:
    name: Agent Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer l’agent
        run: pip install -e './agent[dev]'
      - name: Tester l’agent
        working-directory: agent
        run: pytest -q

  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer les dépendances
        run: pip install -e './backend[dev]'
      - name: Exécuter les tests
        working-directory: backend
        env:
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
        run: pytest -q

  integrations:
    name: Tests intégrations IDS
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer pytest
        run: pip install pytest
      - name: Tester les adaptateurs
        run: pytest -q integrations/tests
      - name: Vérifier le configurateur Wazuh
        run: bash -n integrations/wazuh/configure-cyberpme
      - name: Vérifier les scripts Suricata
        run: |
          bash -n integrations/suricata/install.sh
          bash -n integrations/suricata/uninstall.sh

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci
      - name: Compiler le dashboard
        working-directory: frontend
        run: npm run build

  docker-compose:
    name: Validation Docker Compose
    runs-on: ubuntu-latest
    env:
      AGENT_ENROLLMENT_KEY: ci-enrollment-secret
      NETWORK_SCAN_KEY: ci-network-scan-secret
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Valider la configuration
        run: docker compose config --quiet
