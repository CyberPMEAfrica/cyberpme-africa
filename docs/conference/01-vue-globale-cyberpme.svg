<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061725"/>
      <stop offset="0.62" stop-color="#092334"/>
      <stop offset="1" stop-color="#103b36"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#113a48"/>
      <stop offset="1" stop-color="#0d4a3e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2de0a7"/>
    </marker>
    <style>
      .title{font:700 46px 'Segoe UI',Arial,sans-serif;fill:#f2f8fb}
      .subtitle{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#8eb0c0}
      .label{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#2de0a7;letter-spacing:3px}
      .h2{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#f2f8fb}
      .body{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#b8ccd6}
      .small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#7895a5}
      .box{fill:#0b2534;stroke:#245062;stroke-width:2}
      .cap{fill:#0a1f2d;stroke:#1c4658;stroke-width:1.5}
      .outcome{fill:#0e332f;stroke:#267a67;stroke-width:1.5}
      .line{fill:none;stroke:#2de0a7;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1730" cy="130" r="260" fill="#2de0a7" opacity=".035"/>
  <circle cx="180" cy="980" r="300" fill="#2de0a7" opacity=".025"/>

  <g transform="translate(90 64)">
    <rect x="0" y="0" width="58" height="58" rx="16" fill="#2de0a7"/>
    <text x="29" y="37" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="800" fill="#041b21">CA</text>
    <text x="78" y="25" font-family="Segoe UI,Arial" font-size="24" font-weight="750" fill="#f2f8fb">CyberPME</text>
    <text x="78" y="48" font-family="Segoe UI,Arial" font-size="11" font-weight="700" letter-spacing="5" fill="#2de0a7">AFRICA</text>
  </g>
  <text x="90" y="184" class="label">DIAGRAMME DE CONTEXTE &amp; CAPACITÉS</text>
  <text x="90" y="242" class="title">La cybersécurité des PME, réunie dans une seule plateforme</text>
  <text x="90" y="281" class="subtitle">Surveiller • détecter • prioriser • corriger • prouver</text>

  <!-- Acteurs -->
  <g transform="translate(90 355)">
    <text x="0" y="-28" class="label">UTILISATEURS</text>
    <rect class="box" width="350" height="170" rx="22"/>
    <circle cx="62" cy="63" r="27" fill="#173d4e" stroke="#65dfff" stroke-width="2"/>
    <circle cx="62" cy="55" r="9" fill="none" stroke="#65dfff" stroke-width="3"/>
    <path d="M43 80 Q62 64 81 80" fill="none" stroke="#65dfff" stroke-width="3"/>
    <text x="108" y="56" class="h2">Équipe de la PME</text>
    <text x="108" y="86" class="body">Direction • Admin IT</text>
    <text x="108" y="113" class="body">Analyste • Lecteur</text>
    <text x="28" y="146" class="small">Accès sécurisé et rôles par organisation</text>

    <rect class="box" y="205" width="350" height="276" rx="22"/>
    <text x="28" y="247" class="h2">Infrastructure supervisée</text>
    <g transform="translate(28 272)">
      <rect class="cap" width="138" height="54" rx="12"/><text x="16" y="33" class="body">Windows</text>
      <rect class="cap" x="156" width="138" height="54" rx="12"/><text x="172" y="33" class="body">Linux</text>
      <rect class="cap" y="70" width="138" height="54" rx="12"/><text x="16" y="103" class="body">Réseaux</text>
      <rect class="cap" x="156" y="70" width="138" height="54" rx="12"/><text x="172" y="103" class="body">Domaines</text>
      <rect class="cap" y="140" width="138" height="54" rx="12"/><text x="16" y="173" class="body">Sauvegardes</text>
      <rect class="cap" x="156" y="140" width="138" height="54" rx="12"/><text x="172" y="173" class="body">Wazuh / SIEM</text>
    </g>
  </g>

  <!-- Coeur -->
  <g transform="translate(565 338)" filter="url(#shadow)">
    <rect width="790" height="535" rx="30" fill="url(#hero)" stroke="#2c7167" stroke-width="2"/>
    <text x="42" y="52" class="label">CŒUR SAAS MULTI-PME</text>
    <text x="42" y="96" class="h2" font-size="31">CyberPME Africa</text>
    <text x="42" y="127" class="body">Chaque entreprise voit uniquement ses utilisateurs, actifs et incidents.</text>

    <g transform="translate(42 165)">
      <rect class="cap" width="218" height="126" rx="18"/>
      <circle cx="34" cy="34" r="16" fill="#173d4e"/><path d="M24 35h20M34 25v20" stroke="#65dfff" stroke-width="2"/>
      <text x="24" y="75" class="h2" font-size="20">Supervision</text>
      <text x="24" y="102" class="small">CPU • RAM • Disque</text>

      <rect class="cap" x="244" width="218" height="126" rx="18"/>
      <circle cx="278" cy="34" r="16" fill="#173d4e"/><path d="M270 39l7-14 7 14z" fill="none" stroke="#ffc857" stroke-width="2"/>
      <text x="268" y="75" class="h2" font-size="20">Alertes</text>
      <text x="268" y="102" class="small">Seuils &amp; priorités</text>

      <rect class="cap" x="488" width="218" height="126" rx="18"/>
      <circle cx="522" cy="34" r="16" fill="#173d4e"/><circle cx="522" cy="34" r="8" fill="none" stroke="#2de0a7" stroke-width="2"/><path d="M522 22v5M522 41v5M510 34h5M529 34h5" stroke="#2de0a7" stroke-width="2"/>
      <text x="512" y="75" class="h2" font-size="20">Audit réseau</text>
      <text x="512" y="102" class="small">Nmap • services • PDF</text>

      <rect class="cap" y="148" width="218" height="126" rx="18"/>
      <circle cx="34" cy="182" r="16" fill="#173d4e"/><path d="M27 183l5 5 10-13" fill="none" stroke="#2de0a7" stroke-width="2.5"/>
      <text x="24" y="223" class="h2" font-size="20">Certificats</text>
      <text x="24" y="250" class="small">SSL/TLS &amp; expiration</text>

      <rect class="cap" x="244" y="148" width="218" height="126" rx="18"/>
      <circle cx="278" cy="182" r="16" fill="#173d4e"/><path d="M268 187h20v-12h-20zM272 175v-6h12v6" fill="none" stroke="#65dfff" stroke-width="2"/>
      <text x="268" y="223" class="h2" font-size="20">Sauvegardes</text>
      <text x="268" y="250" class="small">Fraîcheur &amp; restauration</text>

      <rect class="cap" x="488" y="148" width="218" height="126" rx="18"/>
      <circle cx="522" cy="182" r="16" fill="#173d4e"/><path d="M522 169l11 5v8c0 8-5 13-11 16-6-3-11-8-11-16v-8z" fill="none" stroke="#ff7b82" stroke-width="2"/>
      <text x="512" y="223" class="h2" font-size="20">IDS / Incidents</text>
      <text x="512" y="250" class="small">Wazuh • cycle de vie</text>
    </g>

    <rect x="42" y="463" width="706" height="45" rx="12" fill="#09242c" stroke="#2de0a7" stroke-opacity=".4"/>
    <text x="395" y="492" text-anchor="middle" class="body">Sessions sécurisées • isolation multi-tenant • jetons dédiés • API centralisée</text>
  </g>

  <!-- Résultats -->
  <g transform="translate(1480 355)">
    <text x="0" y="-28" class="label">VALEUR POUR LA PME</text>
    <rect class="outcome" width="350" height="105" rx="20"/>
    <text x="26" y="43" class="h2">Visibilité immédiate</text>
    <text x="26" y="72" class="body">Une vue claire de tous les risques</text>

    <rect class="outcome" y="126" width="350" height="105" rx="20"/>
    <text x="26" y="169" class="h2">Réaction structurée</text>
    <text x="26" y="198" class="body">Nouveau → Pris en charge → Résolu</text>

    <rect class="outcome" y="252" width="350" height="105" rx="20"/>
    <text x="26" y="295" class="h2">Décisions prioritaires</text>
    <text x="26" y="324" class="body">Sévérité et actions recommandées</text>

    <rect class="outcome" y="378" width="350" height="105" rx="20"/>
    <text x="26" y="421" class="h2">Preuves &amp; rapports</text>
    <text x="26" y="450" class="body">Historique, PDF et traçabilité</text>
  </g>

  <path class="line" d="M440 555 C500 555 505 555 555 555"/>
  <path class="line" d="M1355 555 C1405 555 1410 555 1470 555"/>

  <g transform="translate(90 980)">
    <rect width="1740" height="1" fill="#315261"/>
    <circle cx="8" cy="38" r="6" fill="#2de0a7"/>
    <text x="26" y="44" class="small">Opérationnel aujourd’hui</text>
    <text x="1460" y="44" class="small">CyberPME Africa • Architecture produit • 2026</text>
  </g>
</svg>
